services:
  - type: web
    name: gov-job-linebot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false          # 在 Render Dashboard 手動填入
      - key: LINE_CHANNEL_SECRET
        sync: false          # 在 Render Dashboard 手動填入
      - key: MAX_CRAWL_PAGES
        value: "3"           # 每次查詢最多 3 頁（約 45 筆）
      - key: TOP_K_RESULTS
        value: "5"           # 回傳給使用者最多 5 個結果

    # ── 資料持久化（選用，需付費 $0.25/GB/月）──────────────────────────────
    # 啟用後 SQLite 訂閱資料才會在 restart 後保留。
    # 免費方案請跳過（restart 後訂閱會清空，重新設定即可）。
    #
    # disk:
    #   name: data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
