services:
  - type: web
    name: gov-job-linebot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false          # LINE Developers Console → Channel secret
      - key: LINE_CHANNEL_SECRET
        sync: false          # LINE Developers Console → Channel access token
      - key: DATABASE_URL
        sync: false          # Neon PostgreSQL 連線字串（postgresql://...?sslmode=require）
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # Telegram @BotFather 取得的 token（不用 Telegram 可留空）
      - key: TOP_K_RESULTS
        value: "10"          # 回傳給使用者最多 10 個結果
