services:
  - type: web
    name: gov-job-linebot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false          # LINE Developers Console → Channel secret
      - key: LINE_CHANNEL_SECRET
        sync: false          # LINE Developers Console → Channel access token
      - key: DATABASE_URL
        sync: false          # Neon PostgreSQL 連線字串（postgresql://...?sslmode=require）
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # Telegram @BotFather 取得的 token（不用 Telegram 可留空）
      - key: TOP_K_RESULTS
        value: "10"          # 回傳給使用者最多 10 個結果

  - type: cron
    name: gov-job-crawler
    runtime: python
    plan: free
    schedule: "0 20 * * *"      # 20:00 UTC = 台灣 04:00（UTC+8）
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_crawl.py
    envVars:
      - key: DATABASE_URL
        sync: false              # 與 web service 使用同一 Neon DB
      - key: MAX_CRAWL_PAGES_SCHEDULED
        value: "0"               # 0 = 全部頁
