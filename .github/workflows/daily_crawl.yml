name: 每日職缺爬取

on:
  schedule:
    # 每天 18:00 UTC = 台灣時間 02:00（避開 DGPA 尖峰時段）
    - cron: '0 18 * * *'
  workflow_dispatch:
    # 允許在 GitHub Actions 介面手動觸發（測試用）
    inputs:
      max_pages:
        description: '最多爬幾頁（0=全部，1=測試用）'
        required: false
        default: '0'
  repository_dispatch:
    # 允許 Render /admin/trigger-crawl 透過 GitHub API 觸發
    types: [trigger-crawl]

jobs:
  crawl:
    name: 爬取 DGPA 職缺並寫入 Neon
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 全量爬取預估 30~50 分鐘

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_CRAWL_PAGES_SCHEDULED: ${{ github.event.inputs.max_pages || '0' }}
          CRAWL_DETAIL_DELAY: '0.3'
        run: python scripts/run_crawl.py
